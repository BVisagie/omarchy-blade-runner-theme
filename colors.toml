# Blade Runner (1982)
# Los Angeles, November 2019. Sodium light through acid rain: the night is
# smog-blue, the light is warm and comes through something. Cyan is the one
# cold neon. Neon through smoke, not a synthwave nightclub.

mode = "dark"

accent = "#E08A3A"
cursor = "#F0E6D2"
muted = "#7C8791"

# Selection is the blinds' blue, at two depths. `selection` fills menus,
# launcher and btop under sodium text: accent on it is 4.52:1, so do not lift
# it further. `selection_background` is the editor and terminal selection,
# lifted so visual-line stays findable: cream on it is 9.31:1.
selection = "#213946"
selection_foreground = "#F0E6D2"
selection_background = "#243C4A"

background = "#0A0E13"
dark_background = "#070A0E"
darker_background = "#040609"
# The lifted panel (tooltips, menus, launcher). Floors on it: muted 4.68:1 and
# red 4.67:1. Brightening this panel fails WCAG AA for both.
lighter_background = "#151C24"

foreground = "#C3BBA9"
dark_foreground = "#7C8791"
light_foreground = "#D8D1C1"
bright_foreground = "#F0E6D2"

hyprland_active_border = "rgba(E08A3Abb) rgba(5EC0CC55) 45deg"
hyprland_inactive_border = "rgba(21394688)"

# Every text hue clears 4.5:1 on both backgrounds and is pulled toward the
# haze. Keywords stay in-world: the magenta slot carries title-card brick, and
# blue is a steel blue kept apart from both the cyan neon and muted comments
# (at least 20 ΔE from muted, so functions never read as comments).
red = "#E05A45"
yellow = "#D8AE5A"
orange = "#E08A3A"
green = "#8DAF7E"
cyan = "#5EC0CC"
blue = "#7093C8"
magenta = "#C8745C"
brown = "#5A3A24"

bright_red = "#F07A62"
bright_yellow = "#EAC77A"
bright_green = "#A8C79A"
bright_cyan = "#86D6DF"
bright_blue = "#98B4DC"
bright_magenta = "#DC9078"

color0 = "#0A0E13"
color1 = "#E05A45"
color2 = "#8DAF7E"
color3 = "#D8AE5A"
color4 = "#7093C8"
color5 = "#C8745C"
color6 = "#5EC0CC"
color7 = "#C3BBA9"
color8 = "#7C8791"
color9 = "#F07A62"
color10 = "#A8C79A"
color11 = "#EAC77A"
color12 = "#98B4DC"
color13 = "#DC9078"
color14 = "#86D6DF"
color15 = "#F0E6D2"
